<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="450" height="120">
  <defs>
    <linearGradient id="rubixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <style>
      .brand-title { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif; font-weight: 800; fill: #ffffff; font-size: 42px; letter-spacing: -0.5px; }
      .brand-sub { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; fill: #38bdf8; letter-spacing: 5px; font-size: 13px; text-transform: uppercase; }
      .hash-icon { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 900; fill: url(#rubixGrad); font-size: 85px; }
    </style>
  </defs>

  <!-- Hashtag Icon -->
  <text x="10" y="90" class="hash-icon">#</text>
  
  <!-- Digital Rubix Branding -->
  <text x="90" y="58" class="brand-title">Digital Rubix</text>
  <text x="94" y="94" class="brand-sub">META ADS AGENCY</text>
</svg>
